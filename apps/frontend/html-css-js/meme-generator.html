<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Meme Generator</title>
    <style>
        body {
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 50px 20px;
            min-height: 100vh;
        }

        #meme-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        h1 {
            font-size: 32px;
        }

        #text-input {
            padding: 10px;
            font-size: 18px;
            width: 300px;
        }

        #meme-container {
            position: relative;
            display: inline-block;
        }

        #meme-img {
            width: 600px;
            max-width: 100%;
            border: 2px solid #333;
            border-radius: 5px;
        }

        #meme-text {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: black;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            width: 90%;
            word-wrap: break-word;
            text-align: center;
        }
    </style>
</head>

<body>
    <div id="meme-wrapper">
        <!-- Heading -->
        <h1>Meme Generator</h1>

        <!-- Input for typing meme text -->
        <input type="text" id="text-input" placeholder="Type your meme text here">

        <!-- Meme image with overlay text -->
        <div id="meme-container">
            <img src="images/cheems_meme.jpeg" alt="Meme Image" id="meme-img">
            <div id="meme-text"></div>
        </div>
    </div>
    <!-- JavaScript: to add the text from the user input -->
    <script>
        const textInput = document.getElementById('text-input');
        const memeText = document.getElementById('meme-text');

        textInput.addEventListener('input', () => {
            memeText.textContent = textInput.value;
        });
    </script>
</body>



</html>
