<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spider-Man Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen flex items-center justify-center bg-gray-900 p-6">
    <div class="bg-white rounded-xl shadow-lg p-6 max-w-sm text-center">
      <img
        src="images/spiderman-image.jpg"
        alt="Spider-Man"
        class="w-32 h-32 rounded-full mx-auto"
      />
      <h1 class="text-2xl font-bold mt-4">Spider-Man</h1>
      <p class="text-gray-600 italic">"With great power comes great responsibility."</p>
      <p class="text-gray-700 text-sm mt-3">
        Peter Parker, a young man bitten by a radioactive spider, gains superhuman abilities and becomes the friendly neighborhood Spider-Man.
      </p>
    </div>
  </body>
  
</html>
